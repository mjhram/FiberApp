apply plugin: 'com.android.application'

android {
    namespace 'mohammad.com.fiberapp'
    compileSdkVersion 34
    defaultConfig {
        applicationId "mohammad.com.fiberapp"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 11
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'

    // Used to browse a user-picked folder (Storage Access Framework) for local .kmz/.geojson files
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.nabinbhandari.android:permissions:4.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.Kaufland:andswipeframework:0.8.4'


}

